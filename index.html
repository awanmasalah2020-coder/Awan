<!DOCTYPE html>
<html>
<head>
  <title>Belajar Tombol HTML</title>
</head>
<body>

  <button onclick="tampilkanPesan()">
    Klik Saya
  </button>

  <p id="hasil"></p>

  <script>
    function tampilkanPesan() {
      document.getElementById("hasil").innerHTML = "HALLO world";
    }
  </script>

</body>
</html>
