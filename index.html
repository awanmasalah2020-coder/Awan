<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Belajar Awan</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#f0f4ff;
      font-family:Arial, sans-serif;

      display:flex;
      justify-content:center;
      padding:20px;
    }

    /* Tampilan utama */
    .container{
      width:100%;
      background:white;
      border-radius:20px;
      padding:30px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      color:#2563eb;
      margin-bottom:20px;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;

      background:#3b82f6;
      color:white;
      font-size:18px;
      cursor:pointer;
    }

    button:hover{
      background:#1d4ed8;
    }

    #hasil{
      margin-top:20px;
      text-align:center;
      font-size:22px;
      font-weight:bold;
      color:#111827;
    }

    #device{
      margin-top:10px;
      text-align:center;
      color:#6b7280;
    }

    /* =========================
       TAMPILAN HP
    ========================= */
    @media (max-width: 768px){
      .container{
        max-width:375px;
      }
    }

    /* =========================
       TAMPILAN DESKTOP
    ========================= */
    @media (min-width: 769px){
      .container{
        max-width:900px;
      }
    }

  </style>
</head>
<body>

  <div class="container">

    <h1>Belajar Awan</h1>

    <button onclick="tampilkanPesan()">
      Klik Saya
    </button>

    <div id="hasil"></div>

    <div id="device"></div>

  </div>

  <script>

    // Tombol Hallo World
    function tampilkanPesan(){
      document.getElementById("hasil").innerHTML = "HALLO world";
    }

    // Deteksi perangkat
    function cekPerangkat(){

      let lebar = window.innerWidth;

      if(lebar <= 768){
        document.getElementById("device").innerHTML =
          "Perangkat yang digunakan: HP / Mobile";
      }else{
        document.getElementById("device").innerHTML =
          "Perangkat yang digunakan: Desktop / Laptop";
      }
    }

    cekPerangkat();

  </script>

</body>
</html>
